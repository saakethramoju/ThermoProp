[project]
name = "thermoprop"
version = "0.3.2"
description = "A Python thermophysical property wrapper for real fluids, ideal gases, liquid rocket propellants, and isotropic engineering materials."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Saaketh Ramoju", email = "skramoju@gmail.com" }
]
requires-python = ">=3.11"
keywords = [
    "thermodynamics",
    "thermophysical-properties",
    "material-properties",
    "isotropic-materials",
    "coolprop",
    "pyromat",
    "rocketprops",
    "fluids",
    "ideal-gas",
    "propellants",
    "engineering",
    "rocket-propulsion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

dependencies = [
    "coolprop>=6.8.0",
    "numpy>=2.4.6",
    "pyromat>=2.2.6",
    "rocketprops>=0.1.8",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/saakethramoju/ThermoProp"
Repository = "https://github.com/saakethramoju/ThermoProp"
Issues = "https://github.com/saakethramoju/ThermoProp/issues"
Changelog = "https://github.com/saakethramoju/ThermoProp/blob/main/CHANGELOG.md"

[tool.thermoprop.credits]
material_properties_database = "Material property database adapted from data compiled by Tyson Tran."

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"