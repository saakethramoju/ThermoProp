[project]
name = "thermoprop"
version = "0.1.4"
description = "A Python thermodynamic property wrapper for fluids and mixtures."
readme = "README.md"
license = "GPL-3.0-only"
authors = [
    { name = "Saaketh Ramoju", email = "rsaaketh@icloud.com" }
]
requires-python = ">=3.13"
keywords = [
    "thermodynamics",
    "coolprop",
    "fluids",
    "ideal-gas",
    "thermophysical-properties",
    "engineering",
    "rocket-propulsion",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "coolprop>=6.8.0",
    "numpy>=2.4.6",
    "pyromat>=2.2.6",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/saakethramoju/ThermoProp"
Repository = "https://github.com/saakethramoju/ThermoProp"
Issues = "https://github.com/saakethramoju/ThermoProp/issues"
Changelog = "https://github.com/saakethramoju/ThermoProp/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"